[project]
name = "microgrid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joris Derese", email = "joris.derese@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]

[project.scripts]
microgrid = "microgrid:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
